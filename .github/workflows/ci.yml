name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pylint
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: |
        black --check api/ src/ config/ || (echo "Run 'black api/ src/ config/' to fix formatting" && exit 1)

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black api/ src/ config/ || (echo "Run 'isort --profile black api/ src/ config/' to fix imports" && exit 1)

    - name: Run flake8
      run: |
        flake8 api/ src/ config/ --max-line-length=120 --extend-ignore=E203,W503
      continue-on-error: true

    - name: Run PyLint
      run: |
        pylint api/ src/ config/ --max-line-length=120 --fail-under=7.0
      continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit
        pip install -r requirements.txt

    - name: Run Bandit security scan
      run: |
        bandit -r api/ src/ config/ -ll
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      run: |
        pytest --cov=src --cov=api --cov-report=xml --cov-report=term-missing -v
      env:
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DATABASE: test_finance_assets
        ALPHA_VANTAGE_API_KEY: test_key
        FRED_API_KEY: test_key
        ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  build-check:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check for syntax errors
      run: |
        python -m py_compile start_api.py
        python -m compileall api/ src/ config/ -q

    - name: Validate imports
      run: |
        python -c "from config import settings; print('Settings import: OK')"
        python -c "from src.database import get_database; print('Database import: OK')"
        python -c "from api.routes import router; print('Routes import: OK')"
      env:
        ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
