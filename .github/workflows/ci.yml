name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint mypy bandit safety
        pip install -r requirements.txt

    - name: Check code formatting with Black
      run: |
        black --check --diff api/ src/ tests/ config/

    - name: Lint with PyLint
      run: |
        pylint api/ src/ config/ --max-line-length=120 --fail-under=7.0 || true

    - name: Type check with mypy
      run: |
        mypy src/ api/ config/ --ignore-missing-imports || true
      continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements.txt

    - name: Run Bandit security scan
      run: |
        bandit -r api/ src/ config/ -f json -o bandit-report.json || true
        bandit -r api/ src/ config/ -ll

    - name: Check for known security vulnerabilities
      run: |
        safety check --json || true
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=src --cov=api --cov-report=xml --cov-report=term-missing
      env:
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DATABASE: test_finance_assets

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --cov=src --cov=api --cov-append --cov-report=xml --cov-report=term-missing
      env:
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DATABASE: test_finance_assets
        ALPHA_VANTAGE_API_KEY: test_key
        FRED_API_KEY: test_key

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, security, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate imports
      run: |
        python -c "import start_api; print('Imports successful')"

    - name: Check for syntax errors
      run: |
        python -m py_compile start_api.py
        find . -name "*.py" -not -path "./.*" -exec python -m py_compile {} \;

  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint black isort flake8
        pip install -r requirements.txt

    - name: Run PyLint
      run: |
        pylint api/ src/ config/ --max-line-length=120 --fail-under=7.0

    - name: Check code formatting with Black
      run: |
        black --check api/ src/ tests/ config/

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black api/ src/ tests/ config/
      continue-on-error: true

    - name: Run flake8
      run: |
        flake8 api/ src/ config/ --max-line-length=120 --extend-ignore=E203,W503
      continue-on-error: true

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest --cov=src --cov=api --cov-report=html --cov-report=term --cov-fail-under=70
      env:
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DATABASE: test_finance_assets

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README exists
      run: |
        test -f README.md || exit 1

    - name: Validate markdown files
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        config-file: '.github/workflows/markdown-link-check-config.json'
      continue-on-error: true

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [code-quality, security, test, lint, build-validation]
    if: always()

    steps:
    - name: Check status
      run: |
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "Tests failed"
          exit 1
        fi
        if [ "${{ needs.security.result }}" == "failure" ]; then
          echo "Security scan failed"
          exit 1
        fi
